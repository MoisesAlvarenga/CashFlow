name: verity-sonarqube

services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube-verity
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      - SONAR_SEARCH_JAVAADDITIONALOPTS=-Dnode.store.allow_mmap=false
    volumes:
      - verity_sonarqube_data:/opt/sonarqube/data
      - verity_sonarqube_extensions:/opt/sonarqube/extensions
      - verity_sonarqube_logs:/opt/sonarqube/logs
    networks:
      - verity-sonar-net

networks:
  verity-sonar-net:
    driver: bridge

volumes:
  verity_sonarqube_data:
  verity_sonarqube_extensions:
  verity_sonarqube_logs:
