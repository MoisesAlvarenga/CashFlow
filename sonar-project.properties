# =====================================================================
# SonarQube Scanner Configuration - Desafio Técnico Verity
# =====================================================================
sonar.projectKey=desafio_tecnico_Verity
sonar.projectName=Desafio Técnico Verity - Fluxo de Caixa e Consolidação Diária
sonar.projectVersion=1.0.0

# Encoding & Platform
sonar.sourceEncoding=UTF-8

# Source Code & Tests Locations
sonar.sources=src
sonar.tests=tests

# Code Coverage & Test Execution Reports (.NET Cobertura / OpenCover / TRX)
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml,**/TestResults/**/coverage.cobertura.xml
sonar.cs.vstest.reportsPaths=**/TestResults/**/*.trx

# Exclusions
sonar.exclusions=**/bin/**,**/obj/**,**/*.designer.cs,**/Migrations/**,**/wwwroot/**
sonar.coverage.exclusions=**Tests/**,**/Program.cs,**/Migrations/**,**/*.json,**/*.md

# Quality Gate integration
sonar.qualitygate.wait=true
